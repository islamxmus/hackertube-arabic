<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>HackerTube Arabic</title><style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--line:#292c33;--muted:#a2a7b1;--red:#e53935}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f5f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{position:sticky;top:0;background:#141519ed;backdrop-filter:blur(12px);z-index:3;border-bottom:1px solid var(--line);padding:14px max(16px,calc((100% - 1200px)/2))} .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:900;font-size:22px;white-space:nowrap}.brand b{color:var(--red)}input{background:#24262d;border:1px solid #383b44;color:white;border-radius:12px;padding:12px 15px;font-size:15px;min-width:0;flex:1}main{max-width:1200px;margin:auto;padding:22px 16px}.intro{color:var(--muted);margin:0 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button,.smallbtn{border:1px solid var(--line);background:var(--panel);color:#eee;border-radius:999px;padding:9px 15px;cursor:pointer}.tabs button.active{background:var(--red);border-color:var(--red)}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px}.side,.content{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}.side h3,.content h2{margin:0 0 12px}.channel-list{display:grid;gap:6px;max-height:65vh;overflow:auto}.channel{display:flex;align-items:center;gap:9px;width:100%;text-align:right;border:0;background:transparent;color:#eee;padding:10px;border-radius:10px;cursor:pointer}.channel:hover,.channel.selected{background:#30323a}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#373a43;color:#fff;font-weight:700;flex:none}.channel span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel small{color:var(--muted);display:block}.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.video{background:#22242a;border:1px solid #333640;border-radius:13px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#30323a;display:block}.vbody{padding:10px}.vtitle{font-size:14px;line-height:1.5;min-height:42px}.meta{font-size:12px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:8px;margin-top:10px}.actions a,.actions button{font:inherit;font-size:12px;text-decoration:none;color:white;border:1px solid #454955;background:#30333b;padding:7px 10px;border-radius:8px;cursor:pointer}.player{margin-bottom:18px;display:none}.player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}.empty{color:var(--muted);padding:30px 8px;text-align:center}.note{color:var(--muted);font-size:12px;line-height:1.7;margin-top:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.channel-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:260px}.videos{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{font-size:19px}}@media(max-width:420px){.videos{grid-template-columns:1fr}.channel-list{grid-template-columns:1fr}}
</style></head><body><header><div class="top"><div class="brand">HackerTube <b>Arabic</b></div><input id="search" placeholder="ابحث عن قناة أو فيديو..."></div></header><main><p class="intro">فيديوهات قنواتك العربية في مكان واحد — اختر قناة لعرض أحدث فيديوهاتها.</p><div class="tabs"><button class="active" data-tab="all">كل القنوات</button><button data-tab="favorites">المفضلة ★</button></div><div class="layout"><aside class="side"><h3>القنوات <small id="count"></small></h3><div class="channel-list" id="channels"></div></aside><section class="content"><h2 id="heading">اختر قناة</h2><div class="player" id="player"><iframe id="frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div id="videos" class="videos"><div class="empty">اختار قناة من القائمة لعرض أحدث فيديوهاتها.</div></div><p class="note">يتم جلب الفيديوهات من موجز YouTube العام عبر خدمة RSS2JSON. قد يتأخر التحميل أحيانًا حسب توفر الخدمة. تشغيل الفيديو يتم من YouTube نفسه.</p></section></div></main><script>
const CHANNELS=[{"id": "UC0SDtV0vZ8Rm6QtSIUeY4mw", "name": "سليم الكترونيك"}, {"id": "UC1MZS_5--i4Z3IIGRiFYRgw", "name": "Match Gamed"}, {"id": "UC1SA9hUh4B4CSf0X4hnpwRw", "name": "MEX19"}, {"id": "UC1SBsYz2ku37xjQKY4sTgjg", "name": "حسين الخطيب"}, {"id": "UC1tPMsySD3aL3fSMYmM57vA", "name": "AriaisDeluX"}, {"id": "UC2H8xJeC43AHklIpoTCT_bA", "name": "Mahmoud El Najjar"}, {"id": "UC2tgkO54KVX9tXqEZWBHDNg", "name": "PREMIUM SUPERMARKET"}, {"id": "UC3VxZTjd-AsklCE6_h3aD8Q", "name": "Santara ma3 Gharib"}, {"id": "UC3hA0SYlwTqAqcBjcFTRHkg", "name": "Wad3anaShow"}, {"id": "UC3mkgkskr9rYpowj4TZTReg", "name": "Hossam Ali"}, {"id": "UC44hIHGE2aJmlnBj8WdtTww", "name": "رحاليستا Rahalista"}, {"id": "UC4Er1q3Tu-LY9ygaruxXG5w", "name": "The Immigrant المهاجر"}, {"id": "UC5i3MpHBispO_IzpHbe9E_w", "name": "Stream Gamed"}, {"id": "UC5p0FTpOleZUc87YVJ8VX-g", "name": "BarryTube"}, {"id": "UC6ysFX9dnIYrwnYL54Lmiew", "name": "RaeedXA"}, {"id": "UC7gMkz1aTlDlLYs9mZtLlBg", "name": "Abdallah lala - عبدالله لالا"}, {"id": "UC85Y6hYF0_It4DdrjZJXwDw", "name": "دؤمن"}, {"id": "UC8AatgwL47be7CAgYTVlMhQ", "name": "Rey"}, {"id": "UC8akUncOZaO4eIOaFLMu4Tg", "name": "Amr Adawy-عمرو عدوي"}, {"id": "UC8bDBv5RivrUeOfcTCbp4HQ", "name": "MAGDYYY"}, {"id": "UC8sEv1jQMESDP2XBJX8lzHQ", "name": "StoryTime"}, {"id": "UC8y7raB-2Idd9qOd_NMx3EQ", "name": "كورة يا كورة"}, {"id": "UCAIxr4DpLZH-Iih4mlbLjiA", "name": "Saba7o Korah - صباحو كورة"}, {"id": "UCAoxdRk2NLCUJe32XWc5Y3A", "name": "Belal Fadl بلال فضل"}, {"id": "UCCXT7K2ZZqAjB4Wp9rxabww", "name": "Miilato"}, {"id": "UCCy3JvT8w_U7vyx1w97aa9Q", "name": "لؤي فوزي"}, {"id": "UCDpFEmsPOT0363uZ9Li81kA", "name": "ميدو شات كورة"}, {"id": "UCIK6LZ_8-2vniyOm_V_h-aw", "name": "المراجعة النهائية"}, {"id": "UCJUCcJUeh0Cz2xyKwkw5Q1w", "name": "beIN SPORTS"}, {"id": "UCKDlY0dIDiVJ7hsnHZOj-Cw", "name": "G3A - احمد الجعفري"}, {"id": "UCLhaZKIxLYaaOKSBk-4KDdQ", "name": "Mohammed RX"}, {"id": "UCN6V1qJ38Iym7vVtRTWN3SQ", "name": "شات شات كورة"}, {"id": "UCNAf1k0yIjyGu3k9BwAg3lg", "name": "Sky Sports Premier League"}, {"id": "UCOHY0d-JVc7BVXJHwZnxn5A", "name": "OBiTO9X"}, {"id": "UCOdAgKfgpL0Dxal4XqXtzMg", "name": "خمسة في عينك"}, {"id": "UCPokJ1HtDczTd0rRPMwMeWw", "name": "Omar aburobb"}, {"id": "UCQFWgDiezuoyjitm2achPEQ", "name": "لوريستي"}, {"id": "UCSP_QPmMRCgfXyUzt44YMLg", "name": "Hydra_X001"}, {"id": "UCSZbXT5TLLW_i-5W8FZpFsg", "name": "Major League Soccer"}, {"id": "UCUVbdXWzsaFYPevz-zWnkXQ", "name": "Rami Abdulhai"}, {"id": "UCV-GRnLX8rcNuhYRf-PjB7Q", "name": "malaksempire"}, {"id": "UCXBXWaixThHYeoLWxhJAmBg", "name": "Feitz Extra"}, {"id": "UCaIM7U5vrZkvLAz_BFCiyPw", "name": "حكاوي - عمرو عابدين"}, {"id": "UCbCCQuFLxP3MC6n992NcPKw", "name": "Mondy"}, {"id": "UCbhI7DNm-vGLu8gERZXpvgQ", "name": "شوط"}, {"id": "UCdgVjrDhAs3rpJUcC1Ae5qA", "name": "Asem kamal"}, {"id": "UCdi3n18zcIZeTk_x9qvSgZw", "name": "DAZN"}, {"id": "UCdttmnJddGQZsXRL_DbqgWA", "name": "MahmoudIsmailTV"}, {"id": "UCeQU_NKA83ZzxphEU3tjMsQ", "name": "omar kato"}, {"id": [{"id": "UCOSDtV0vZ8Rm6QtSlUEY4mQ"}, {"id": "RClbxi3Q", "name": "Bassem Opinions - باسم أوبينيونز"}]

const $=s=>document.querySelector(s);let selected=null,tab='all',items=[];let favorites=JSON.parse(localStorage.getItem('ht-ar-favs')||'[]');
function renderChannels(){let q=$('#search').value.trim().toLowerCase();let list=CHANNELS.filter(c=>(tab!=='favorites'||favorites.includes(c.id))&&(c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)));$('#count').textContent='('+list.length+')';$('#channels').innerHTML=list.map(c=>`<button class="channel ${selected===c.id?'selected':''}" data-id="${c.id}"><span class="avatar">${esc(c.name.slice(0,1))}</span><span>${esc(c.name)}<small>فتح القناة</small></span></button>`).join('')||'<div class="empty">لا توجد نتائج</div>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderVideos(){let q=$('#search').value.trim().toLowerCase();let filtered=items.filter(v=>v.title.toLowerCase().includes(q));$('#videos').innerHTML=filtered.map(v=>`<article class="video"><img class="thumb" src="${v.thumbnail}" loading="lazy" alt=""><div class="vbody"><div class="vtitle">${esc(v.title)}</div><div class="meta">${esc(v.date||'')}</div><div class="actions"><button data-play="${v.id}">▶ تشغيل</button><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">فتح يوتيوب ↗</a></div></div></article>`).join('')||'<div class="empty">لا توجد فيديوهات مطابقة.</div>';}
async function loadChannel(id){selected=id;let c=CHANNELS.find(x=>x.id===id);$('#heading').textContent=c?c.name:'الفيديوهات';$('#videos').innerHTML='<div class="empty">جارٍ تحميل الفيديوهات...</div>';$('#player').style.display='none';renderChannels();try{let feed=encodeURIComponent('https://www.youtube.com/feeds/videos.xml?channel_id='+id);let res=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+feed);if(!res.ok)throw Error('network');let data=await res.json();if(data.status!=='ok')throw Error('feed');items=(data.items||[]).map(v=>{let m=v.link.match(/[?&]v=([^&]+)/)||v.guid.match(/video:([^:]+)/);let vid=m?m[1]:'';return{id:vid,title:v.title,thumbnail:vid?'https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg':'',date:(v.pubDate||'').slice(0,10)}}).filter(v=>v.id);renderVideos();}catch(e){items=[];$('#videos').innerHTML='<div class="empty">تعذر تحميل الفيديوهات حاليًا. جرّب مرة أخرى بعد قليل، أو افتح القناة مباشرة من YouTube.</div><div class="actions"><a href="https://www.youtube.com/channel/'+id+'" target="_blank" rel="noopener">فتح القناة على يوتيوب ↗</a><button id="retry">إعادة المحاولة</button></div>';}}
$('#channels').addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b)loadChannel(b.dataset.id)});$('#videos').addEventListener('click',e=>{let b=e.target.closest('[data-play]');if(b){$('#frame').src='https://www.youtube-nocookie.com/embed/'+b.dataset.play+'?autoplay=1';$('#player').style.display='block';window.scrollTo({top:$('#player').getBoundingClientRect().top+window.scrollY-100,behavior:'smooth'});}if(e.target.id==='retry'&&selected)loadChannel(selected)});$('#search').addEventListener('input',()=>{renderChannels();if(selected)renderVideos()});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderChannels()}));renderChannels();
</script></body></html>
